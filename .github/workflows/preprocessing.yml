name: Preprocessing Pipeline

on:
  push:
    branches: [main]
    paths:
      - "namadataset_raw/**"
      - "automate_Sultan.py"
      - "Eksperimen_Sultan.ipynb"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  preprocessing:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run preprocessing
        run: |
          python automate_Sultan.py

      - name: Verify processed data
        run: |
          echo "=== Checking processed data ==="
          ls -la preprocessing/
          python -c "
          import pandas as pd
          X_train = pd.read_csv('preprocessing/X_train.csv')
          X_test = pd.read_csv('preprocessing/X_test.csv')
          print(f'X_train shape: {X_train.shape}')
          print(f'X_test shape: {X_test.shape}')
          print('Preprocessing verification: PASSED')
          "

      - name: Upload processed data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: preprocessing/
          retention-days: 30
